  - path: course1/unit1/lesson1/lessonpart1/linier.py
    content: "def linear_search(names, target):\r

      \    for i in range(len(names)):\r

      \        if names[i] == target:\r

      \            return i # Mengembalikan indeks tempat target ditemukan\r

      \    return -1 # Jika tidak ditemukan\r

      \r

      # Daftar nama\r

      names = ['Ali', 'Budi', 'Charlie', 'Dian', 'Eva']\r

      target = 'Dian'\r

      result = linear_search(names, target)\r

      \r

      if result!= -1:\r

      \    print(f'{target} ditemukan pada indeks {result}')\r

      else:\r

      \    print(f'{target} tidak ditemukan dalam daftar.')\r

      \r

      \    "
